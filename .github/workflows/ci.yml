name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-guards:
    name: Platform guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Получить исходники без сохранения credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Установить закреплённые инструменты с проверкой хешей
        run: python -m pip install --require-hashes --only-binary=:all: -r locks/tooling.txt
      - name: Проверить соответствие locks исходным requirements
        run: python scripts/backend.py lock --check
      - name: Проверить платформенные регрессии
        run: python -m unittest discover -s tests/platform -v
      - name: Проверить строгие типы платформенных инструментов
        run: python -m mypy --strict scripts/backend.py scripts/pytest_required.py tests/platform
      - name: Проверить линтер платформенных инструментов
        run: python -m ruff check scripts/backend.py scripts/pytest_required.py tests/platform

  backend-unit:
    name: Backend ${{ matrix.profile }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        profile: [management, client]
    steps:
      - name: Получить исходники без сохранения credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Установить закреплённые инструменты с проверкой хешей
        run: python -m pip install --require-hashes --only-binary=:all: -r locks/tooling.txt
      - name: Чистая установка и все unit-тесты выбранного AR-сервиса
        run: python scripts/backend.py check ${{ matrix.profile }}

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Получить исходники без сохранения credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установить зависимости по существующему lock
        run: npm ci --no-audit --no-fund
      - name: Проверить типы
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
      - name: Линтер
        run: npm run lint
      - name: Unit-тесты
        run: npm test
      - name: Сборка
        run: npm run build
