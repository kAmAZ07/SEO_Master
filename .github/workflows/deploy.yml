name: Deploy to Production

# Деплой выключен, пока нет сервера: задание пропускается (skipped), а не падает.
# Включить: Settings -> Secrets and variables -> Actions -> Variables -> DEPLOY_ENABLED=true
# (и задать секреты SERVER_HOST, SERVER_SSH_KEY). Ручной запуск: вкладка Actions -> Run workflow.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/seo-master
            git fetch origin
            git reset --hard origin/main
            cp config/nginx.conf /etc/nginx/sites-enabled/seo-master
            cd frontend && rm -rf dist node_modules/.cache && npm install --silent && npm run build && cd ..
            docker compose build
            docker compose up -d
            nginx -t && systemctl reload nginx
            echo "Deployed at $(date)"
