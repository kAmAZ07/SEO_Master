name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/seo-master
            git fetch origin
            git reset --hard origin/main
            cp config/nginx.conf /etc/nginx/sites-enabled/seo-master
            cd frontend && rm -rf dist node_modules/.cache && npm install --silent && npm run build && cd ..
            docker compose build
            docker compose up -d
            nginx -t && systemctl reload nginx
            echo "Deployed at $(date)"
