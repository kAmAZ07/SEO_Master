name: seo-master-dev

services:
  postgres:
    image: postgres:15-alpine
    container_name: seo-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-seo_platform}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init_schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seo_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: seo-redis-dev
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: seo-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-seo_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_pass}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend

  audit-service:
    build:
      context: .
      dockerfile: services/audit_service/Dockerfile
    container_name: seo-audit-service-dev
    command: python -m uvicorn services.audit_service.main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      AUDIT_PORT: 8001
      AUDIT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      AUDIT_RABBITMQ_URL: amqp://${RABBITMQ_USER:-seo_user}:${RABBITMQ_PASSWORD:-rabbitmq_pass}@rabbitmq:5672//
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8001:8001"
    volumes:
      - ./:/app
    networks:
      - backend

  semantic-service:
    build:
      context: .
      dockerfile: services/semantic_service/Dockerfile
    container_name: seo-semantic-service-dev
    command: python -m uvicorn services.semantic_service.main:app --host 0.0.0.0 --port 8002 --reload
    environment:
      SEMANTIC_PORT: 8002
      SEMANTIC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      SEMANTIC_RABBITMQ_URL: amqp://${RABBITMQ_USER:-seo_user}:${RABBITMQ_PASSWORD:-rabbitmq_pass}@rabbitmq:5672//
      SEMANTIC_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8002:8002"
    volumes:
      - ./:/app
    networks:
      - backend

  reporting-service:
    build:
      context: .
      dockerfile: services/reporting_service/Dockerfile
    container_name: seo-reporting-service-dev
    command: python -m uvicorn services.reporting_service.main:app --host 0.0.0.0 --port 8003 --reload
    environment:
      REPORTING_PORT: 8003
      REPORTING_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      REPORTING_RABBITMQ_URL: amqp://${RABBITMQ_USER:-seo_user}:${RABBITMQ_PASSWORD:-rabbitmq_pass}@rabbitmq:5672//
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8003:8003"
    volumes:
      - ./:/app
    networks:
      - backend

  tilda-adapter:
    build:
      context: .
      dockerfile: adapters/tilda-adapter/Dockerfile
    container_name: seo-tilda-adapter-dev
    command: python -m uvicorn main:app --app-dir /app/adapters/tilda-adapter --host 0.0.0.0 --port 8010 --reload
    environment:
      TILDA_PORT: 8010
      TILDA_PUBLIC_KEY: ${TILDA_PUBLIC_KEY:-}
      TILDA_SECRET_KEY: ${TILDA_SECRET_KEY:-}
      TILDA_INTERNAL_API_KEY: ${TILDA_INTERNAL_API_KEY:-change-me}
      TILDA_WEBHOOK_SECRET: ${TILDA_WEBHOOK_SECRET:-}
    ports:
      - "8010:8010"
    volumes:
      - ./:/app
    networks:
      - backend

  management-web:
    build: &management-dev-build
      context: .
      dockerfile: services/management_service/Dockerfile
    container_name: seo-management-web-dev
    command: python -m uvicorn services.management_service.main:app --host 0.0.0.0 --port 8004 --reload
    environment: &management-dev-env
      HOST: 0.0.0.0
      PORT: 8004
      DATABASE_URL: postgresql://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-seo_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbitmq_pass}
      RABBITMQ_VHOST: /
      AUDIT_SERVICE_URL: http://audit-service:8001
      SEMANTIC_SERVICE_URL: http://semantic-service:8002
      REPORTING_SERVICE_URL: http://reporting-service:8003
      CLIENT_GATEWAY_URL: http://client-api-gateway:8005
      CLIENT_API_HMAC_KEYS_JSON: ${CLIENT_API_HMAC_KEYS_JSON:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    depends_on: &management-dev-depends
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      audit-service:
        condition: service_started
      semantic-service:
        condition: service_started
      reporting-service:
        condition: service_started
      client-api-gateway:
        condition: service_started
    ports:
      - "8004:8004"
    volumes:
      - ./:/app
    networks:
      backend:
        aliases:
          - management-service

  management-worker:
    build: *management-dev-build
    container_name: seo-management-worker-dev
    command: celery -A services.management_service.tasks.celery_app:celery_app worker --loglevel=INFO --queues=management,management_periodic --hostname=management-worker@%h
    environment: *management-dev-env
    depends_on: *management-dev-depends
    volumes:
      - ./:/app
    networks:
      - backend
    healthcheck:
      disable: true

  management-beat:
    build: *management-dev-build
    container_name: seo-management-beat-dev
    command: celery -A services.management_service.tasks.celery_app:celery_app beat --loglevel=INFO --schedule=/tmp/management-celerybeat-schedule
    environment: *management-dev-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      management-worker:
        condition: service_started
    volumes:
      - ./:/app
    networks:
      - backend
    healthcheck:
      disable: true

  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    container_name: seo-api-gateway-dev
    command: python -m uvicorn services.api_gateway.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      API_GATEWAY_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-32-chars-minimum}
      AUDIT_SERVICE_URL: http://audit-service:8001
      MANAGEMENT_SERVICE_URL: http://management-web:8004
      SEMANTIC_SERVICE_URL: http://semantic-service:8002
      REPORTING_SERVICE_URL: http://reporting-service:8003
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      audit-service:
        condition: service_started
      management-web:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    networks:
      - backend

  client-api-gateway:
    build:
      context: .
      dockerfile: services/client_api_gateway/Dockerfile
    container_name: seo-client-api-gateway-dev
    command: python -m uvicorn services.client_api_gateway.main:app --host 0.0.0.0 --port 8005 --reload
    environment:
      SERVICE_PORT: 8005
      DATABASE_URL: postgresql://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      WORDPRESS_BASE_URL: ${WORDPRESS_BASE_URL:-}
      WORDPRESS_HMAC_SECRET: ${WORDPRESS_HMAC_SECRET:-}
      CLIENT_API_HMAC_KEYS_JSON: ${CLIENT_API_HMAC_KEYS_JSON:-}
      CLIENT_API_RATE_LIMIT_PER_PROJECT: ${CLIENT_API_RATE_LIMIT_PER_PROJECT:-100}
      CLIENT_API_RATE_LIMIT_WINDOW_SECONDS: ${CLIENT_API_RATE_LIMIT_WINDOW_SECONDS:-3600}
      CLIENT_API_IP_WHITELIST: ${CLIENT_API_IP_WHITELIST:-}
      CLIENT_API_TRUST_PROXY_HEADERS: ${CLIENT_API_TRUST_PROXY_HEADERS:-false}
      TILDA_ADAPTER_URL: ${TILDA_ADAPTER_URL:-http://tilda-adapter:8010}
      TILDA_INTERNAL_API_KEY: ${TILDA_INTERNAL_API_KEY:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      tilda-adapter:
        condition: service_started
    ports:
      - "8005:8005"
    volumes:
      - ./:/app
    networks:
      - backend

volumes:
  postgres_dev_data:
    driver: local

networks:
  backend:
    driver: bridge
