name: seo-master

services:
  postgres:
    image: postgres:15-alpine
    container_name: seo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-seo_platform}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seo_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: seo-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: seo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-seo_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_pass}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  audit-service:
    build:
      context: .
      dockerfile: services/audit_service/Dockerfile
    container_name: seo-audit-service
    environment:
      AUDIT_PORT: 8001
      AUDIT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      AUDIT_RABBITMQ_URL: amqp://${RABBITMQ_USER:-seo_user}:${RABBITMQ_PASSWORD:-rabbitmq_pass}@rabbitmq:5672//
      AUDIT_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    networks:
      - backend
      - database
    restart: unless-stopped

  semantic-service:
    build:
      context: .
      dockerfile: services/semantic_service/Dockerfile
    container_name: seo-semantic-service
    environment:
      SEMANTIC_PORT: 8002
      SEMANTIC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      SEMANTIC_RABBITMQ_URL: amqp://${RABBITMQ_USER:-seo_user}:${RABBITMQ_PASSWORD:-rabbitmq_pass}@rabbitmq:5672//
      SEMANTIC_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8002"
    networks:
      - backend
      - database
    restart: unless-stopped

  reporting-service:
    build:
      context: .
      dockerfile: services/reporting_service/Dockerfile
    container_name: seo-reporting-service
    environment:
      REPORTING_PORT: 8003
      REPORTING_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      REPORTING_RABBITMQ_URL: amqp://${RABBITMQ_USER:-seo_user}:${RABBITMQ_PASSWORD:-rabbitmq_pass}@rabbitmq:5672//
      REPORTING_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8003:8003"
    networks:
      - backend
      - database
    restart: unless-stopped

  tilda-adapter:
    build:
      context: .
      dockerfile: adapters/tilda-adapter/Dockerfile
    container_name: seo-tilda-adapter
    environment:
      TILDA_PORT: 8010
      TILDA_PUBLIC_KEY: ${TILDA_PUBLIC_KEY:-}
      TILDA_SECRET_KEY: ${TILDA_SECRET_KEY:-}
      TILDA_INTERNAL_API_KEY: ${TILDA_INTERNAL_API_KEY:-change-me}
      TILDA_WEBHOOK_SECRET: ${TILDA_WEBHOOK_SECRET:-}
      TILDA_WEBHOOK_FORWARD_URL: ${TILDA_WEBHOOK_FORWARD_URL:-http://client-api-gateway:8005/internal/tilda/webhook/published}
      TILDA_WEBHOOK_FORWARD_API_KEY: ${TILDA_WEBHOOK_FORWARD_API_KEY:-change-me}
    ports:
      - "8010:8010"
    networks:
      - backend
    restart: unless-stopped

  management-web:
    build: &management-build
      context: .
      dockerfile: services/management_service/Dockerfile
    container_name: seo-management-web
    command: ["uvicorn", "services.management_service.main:app", "--host", "0.0.0.0", "--port", "8004"]
    environment: &management-env
      HOST: 0.0.0.0
      PORT: 8004
      DATABASE_URL: postgresql://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-seo_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbitmq_pass}
      RABBITMQ_VHOST: /
      AUDIT_SERVICE_URL: http://audit-service:8001
      SEMANTIC_SERVICE_URL: http://semantic-service:8002
      REPORTING_SERVICE_URL: http://reporting-service:8003
      CLIENT_GATEWAY_URL: http://client-api-gateway:8005
      CLIENT_API_HMAC_KEYS_JSON: ${CLIENT_API_HMAC_KEYS_JSON:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me}
    depends_on: &management-depends
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      audit-service:
        condition: service_started
      semantic-service:
        condition: service_started
      reporting-service:
        condition: service_started
      client-api-gateway:
        condition: service_started
    ports:
      - "8004:8004"
    networks:
      backend:
        aliases:
          - management-service
      database: {}
    restart: unless-stopped

  management-worker:
    build: *management-build
    container_name: seo-management-worker
    command:
      [
        "celery",
        "-A",
        "services.management_service.tasks.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=management,management_periodic",
        "--hostname=management-worker@%h"
      ]
    environment: *management-env
    depends_on: *management-depends
    healthcheck:
      disable: true
    networks:
      - backend
      - database
    restart: unless-stopped

  management-beat:
    build: *management-build
    container_name: seo-management-beat
    command:
      [
        "celery",
        "-A",
        "services.management_service.tasks.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/management-celerybeat-schedule"
      ]
    environment: *management-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      management-worker:
        condition: service_started
    healthcheck:
      disable: true
    networks:
      - backend
      - database
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    container_name: seo-api-gateway
    environment:
      API_GATEWAY_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-32-chars-minimum}
      AUDIT_SERVICE_URL: http://audit-service:8001
      MANAGEMENT_SERVICE_URL: http://management-web:8004
      SEMANTIC_SERVICE_URL: http://semantic-service:8002
      REPORTING_SERVICE_URL: http://reporting-service:8003
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      audit-service:
        condition: service_started
      management-web:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - backend
      - database
    restart: unless-stopped

  client-api-gateway:
    build:
      context: .
      dockerfile: services/client_api_gateway/Dockerfile
    container_name: seo-client-api-gateway
    environment:
      SERVICE_PORT: 8005
      DATABASE_URL: postgresql://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORDPRESS_BASE_URL: ${WORDPRESS_BASE_URL:-}
      WORDPRESS_HMAC_SECRET: ${WORDPRESS_HMAC_SECRET:-}
      CLIENT_API_HMAC_KEYS_JSON: ${CLIENT_API_HMAC_KEYS_JSON:-}
      CLIENT_API_RATE_LIMIT_PER_PROJECT: ${CLIENT_API_RATE_LIMIT_PER_PROJECT:-100}
      CLIENT_API_RATE_LIMIT_WINDOW_SECONDS: ${CLIENT_API_RATE_LIMIT_WINDOW_SECONDS:-3600}
      CLIENT_API_IP_WHITELIST: ${CLIENT_API_IP_WHITELIST:-}
      CLIENT_API_TRUST_PROXY_HEADERS: ${CLIENT_API_TRUST_PROXY_HEADERS:-false}
      TILDA_ADAPTER_URL: ${TILDA_ADAPTER_URL:-http://tilda-adapter:8010}
      TILDA_INTERNAL_API_KEY: ${TILDA_INTERNAL_API_KEY:-change-me}
      MANAGEMENT_SERVICE_URL: ${MANAGEMENT_SERVICE_URL:-http://management-web:8004}
    depends_on:
      postgres:
        condition: service_healthy
      tilda-adapter:
        condition: service_started
    ports:
      - "8005:8005"
    networks:
      - backend
      - database
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  backend:
    driver: bridge
  database:
    driver: bridge
