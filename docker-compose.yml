version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: seo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-seo_platform}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_schema.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seo_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: seo-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass} --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: seo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-seo_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_pass}
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 1024MiB
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  audit-service:
    build:
      context: .
      dockerfile: services/audit_service/Dockerfile
    container_name: seo-audit-service
    environment:
      AUDIT_PORT: 8001
      AUDIT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      AUDIT_RABBITMQ_URL: amqp://${RABBITMQ_USER:-seo_user}:${RABBITMQ_PASSWORD:-rabbitmq_pass}@rabbitmq:5672//
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8001:8001"
    volumes:
      - ./logs:/app/logs
    networks:
      - backend
      - database
    restart: unless-stopped

  management-service:
    build:
      context: .
      dockerfile: services/management_service/Dockerfile
    container_name: seo-management-service
    environment:
      HOST: 0.0.0.0
      PORT: 8004
      DATABASE_URL: postgresql://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-seo_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbitmq_pass}
      RABBITMQ_VHOST: /
      AUDIT_SERVICE_URL: http://audit-service:8001
      SEMANTIC_SERVICE_URL: http://semantic-service:8002
      REPORTING_SERVICE_URL: http://reporting-service:8003
      CLIENT_GATEWAY_URL: http://client-api-gateway:8005
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      client-api-gateway:
        condition: service_started
      audit-service:
        condition: service_started
    ports:
      - "8004:8004"
    volumes:
      - ./logs:/app/logs
    networks:
      - backend
      - database
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    container_name: seo-api-gateway
    environment:
      API_GATEWAY_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      AUDIT_SERVICE_URL: http://audit-service:8001
      MANAGEMENT_SERVICE_URL: http://management-service:8004
      SEMANTIC_SERVICE_URL: http://semantic-service:8002
      REPORTING_SERVICE_URL: http://reporting-service:8003
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      audit-service:
        condition: service_started
      management-service:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    networks:
      - backend
      - database
    restart: unless-stopped

  client-api-gateway:
    build:
      context: .
      dockerfile: services/client_api_gateway/Dockerfile
    container_name: seo-client-api-gateway
    environment:
      SERVICE_PORT: 8005
      DATABASE_URL: postgresql://${POSTGRES_USER:-seo_user}:${POSTGRES_PASSWORD:-seo_pass}@postgres:5432/${POSTGRES_DB:-seo_platform}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8005:8005"
    volumes:
      - ./logs:/app/logs
    networks:
      - backend
      - database
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  backend:
    driver: bridge
  database:
    driver: bridge
    internal: true
